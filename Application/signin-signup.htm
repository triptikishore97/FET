<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="./css/styles.css"> 
    <title>Login</title> 
</head>
<body class="form-body">
    <div class="form">
        <input type="radio" id="signin" name="tab" checked>
        <label class="form-label" for="signin">Sign In</label>
        
        <input type="radio" id="signup" name="tab">
        <label class="form-label" for="signup">Sign Up</label>

        <div class="form signin-form">
            <h2>Sign In</h2>
            <form action="#" method="POST">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>
            <p class="form-text">Don't have an account? <label class="form-label" for="signup">Sign Up Here</label></p>
        </div>

        <div class="form signup-form">
            <h2>Sign Up</h2>
            <form action="#" method="POST">
                <input type="text" name="firstname" placeholder="First Name" required>
                <input type="text" name="lastname" placeholder="Last Name" required>
                <input type="email" name="email" placeholder="Email Address" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Sign Up</button>
            </form>
            <p class="form-text">Already have an account? <label class="form-label" for="signin">Sign In Here</label></p>
        </div>
    </div>
</body>
</html>
